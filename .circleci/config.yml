version: 2.1

orbs:
  php: circleci/php@2.0.0

jobs:
  test:
    docker:
      - image: cimg/php:8.3
    steps:
      - checkout
      - php/install_packages:
          cache_key: composer.json
      - run:
          name: Run tests
          command: vendor/bin/phpunit

workflows:
  test:
    jobs:
      - test
